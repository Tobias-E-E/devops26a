# kustomize-controller applies as the target namespace's default ServiceAccount
# unless told otherwise — that has no write permissions and the first
# reconcile fails with Forbidden (verified in TASK-8). This dedicated SA,
# bound to admin below, is what spec.serviceAccountName on the Kustomization
# CR (kustomization.yaml in this directory) points at.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-applier
  namespace: <projekt-namespace>-dev
