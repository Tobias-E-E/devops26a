# Flux's Kustomization CR (kustomize.toolkit.fluxcd.io) — NOT a kustomize
# kustomization.yaml. This is what actually applies gitops/overlays/dev to
# the cluster once GitRepository has synced. Field names match TASK-8's
# verified minimal spec.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: template-app-dev
  namespace: <projekt-namespace>-dev
spec:
  interval: 1m
  path: ./gitops/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: template-app-gitops
  serviceAccountName: flux-applier
  targetNamespace: <projekt-namespace>-dev
