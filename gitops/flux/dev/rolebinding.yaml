# Grants the flux-applier ServiceAccount admin rights scoped to this one
# namespace (RoleBinding, not ClusterRoleBinding) by binding it to the
# built-in "admin" ClusterRole. Verified working pattern from TASK-8.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-applier-admin
  namespace: <projekt-namespace>-dev
subjects:
  - kind: ServiceAccount
    name: flux-applier
    namespace: <projekt-namespace>-dev
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
