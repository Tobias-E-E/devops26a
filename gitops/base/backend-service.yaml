apiVersion: v1
kind: Service
metadata:
  # Name must stay "backend" — frontend/nginx.conf proxies /api/ to
  # http://backend:8000/, same as the backend service name in docker-compose.yml.
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - port: 8000
      targetPort: 8000
