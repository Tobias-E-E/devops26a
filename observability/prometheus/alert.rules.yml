groups:
  - name: app-availability
    rules:
      # Fires when the blackbox probe against the app's health endpoint
      # (frontend -> nginx -> backend, see prometheus.yml) has been failing
      # for 30s straight. Covers both "frontend container down" (probe
      # can't connect at all) and "backend down but frontend up" (nginx
      # proxies to a 502, which is not a 2xx so the probe still fails).
      - alert: AppDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "App endpoint {{ $labels.instance }} is down"
          description: >-
            Blackbox probe against {{ $labels.instance }} has failed for
            more than 30s. The app (frontend and/or backend) is likely down.
