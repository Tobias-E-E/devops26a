groups:
  - name: app-availability
    rules:
      # Fires when the blackbox probe against the app's health endpoint
      # (frontend -> nginx -> backend, see prometheus.yml) has been failing
      # for 30s straight. Covers both "frontend container down" (probe
      # can't connect at all) and "backend down but frontend up" (nginx
      # proxies to a 502, which is not a 2xx so the probe still fails).
      - alert: AppDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "App endpoint {{ $labels.instance }} is down"
          description: >-
            Blackbox probe against {{ $labels.instance }} has failed for
            more than 30s. The app (frontend and/or backend) is likely down.

  - name: app-latency
    rules:
      # Own rule (Spår A): the health check itself is slow. probe_duration_seconds
      # is a gauge, so we average it over 1m instead of rate()-ing it.
      - alert: HealthCheckSlow
        expr: avg_over_time(probe_duration_seconds{job="blackbox-http"}[1m]) > 0.004
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Health check on {{ $labels.instance }} is slow"
          description: >-
            The blackbox probe against {{ $labels.instance }} has averaged more
            than 0.5s (self-test: 4 ms) over the last minute. The app is up but responding slowly.
